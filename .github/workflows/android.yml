name: Android APK

# Builds the JARVIS Android app in GitHub's cloud (free for public repos).
# - Publishes an UNSIGNED release build as a GitHub Release (tag app-<version>) with apksigner.jar.
#   Your JARVIS server downloads it, signs it with ITS OWN key and offers it to the phone as an
#   in-app update. No signing key is ever stored in GitHub.
# - Also keeps a debug APK as a run artifact (for testing only).
on:
  workflow_dispatch: {}
  push:
    branches: [v2, main]
    paths: ["mobile/**", "jarvis/server/static/**", ".github/workflows/android.yml"]

permissions:
  contents: write   # create the release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Use the runner's preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > mobile/android/local.properties && ls "$ANDROID_HOME"

      - name: Install JS deps and copy the UI into the app
        working-directory: mobile
        run: |
          set -o pipefail
          (npm install --no-audit --no-fund && npm run build:web && npx cap sync android) 2>&1 | tee ../build.log

      - name: Bundle the on-device wake-word models
        run: |
          mkdir -p mobile/android/app/src/main/assets/models
          for f in melspectrogram.onnx embedding_model.onnx hey_jarvis_v0.1.onnx; do
            curl -sSL -o mobile/android/app/src/main/assets/models/$f \
              https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/$f
          done

      - name: Build release (unsigned) and debug APKs
        working-directory: mobile/android
        run: |
          set -o pipefail
          chmod +x gradlew
          V=$((100 + ${{ github.run_number }}))
          echo "JARVIS_VERSION=$V" >> "$GITHUB_ENV"
          ./gradlew --no-daemon -PjarvisVersion=$V assembleRelease assembleDebug 2>&1 | tee -a ../../build.log

      - name: Publish release for the server to sign
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p rel
          cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk rel/jarvis-unsigned.apk
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/lib/apksigner.jar | sort -V | tail -1)
          cp "$SIGNER" rel/apksigner.jar
          (cd rel && for f in jarvis-unsigned.apk apksigner.jar; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done)
          NOTES=$(git log -1 --pretty=%B | head -c 1500)
          gh release create "app-$JARVIS_VERSION" rel/* --target "$GITHUB_SHA" \
            --title "JARVIS app 2.$JARVIS_VERSION" --notes "$NOTES" --latest

      - name: Report errors as annotations (readable without log access)
        if: failure()
        run: |
          touch build.log
          grep -nE "error:|ERROR|FAILURE|What went wrong|Could not|cannot find symbol|incompatible types|unreported exception" build.log | head -40 > errs.txt || true
          [ -s errs.txt ] || tail -40 build.log > errs.txt
          while IFS= read -r line; do echo "::error title=build::${line:0:900}"; done < errs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
