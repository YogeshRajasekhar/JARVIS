name: Android APK

# Builds the JARVIS Android app in GitHub's cloud (free for public repos) and attaches the APK
# to the run. Download it from the run's "Artifacts" section and install it on your phone.
on:
  workflow_dispatch: {}
  push:
    branches: [v2, main]
    paths: ["mobile/**", "jarvis/server/static/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: android-actions/setup-android@v3

      - name: Install JS deps and copy the UI into the app
        working-directory: mobile
        run: |
          set -o pipefail
          (npm install --no-audit --no-fund && npm run build:web && npx cap sync android) 2>&1 | tee ../build.log

      - name: Bundle the on-device wake-word models
        run: |
          mkdir -p mobile/android/app/src/main/assets/models
          for f in melspectrogram.onnx embedding_model.onnx hey_jarvis_v0.1.onnx; do
            curl -sSL -o mobile/android/app/src/main/assets/models/$f \
              https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/$f
          done

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug 2>&1 | tee -a ../../build.log

      - name: Report errors as annotations (readable without log access)
        if: failure()
        run: |
          touch build.log
          grep -nE "error:|ERROR|FAILURE|What went wrong|Could not|cannot find symbol|incompatible types|unreported exception" build.log | head -40 > errs.txt || true
          [ -s errs.txt ] || tail -40 build.log > errs.txt
          while IFS= read -r line; do echo "::error title=build::${line:0:900}"; done < errs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
