# JARVIS on a free cloud VM, reachable ONLY over your private Tailscale network with HTTPS.
# Nothing is exposed to the public internet: the jarvis container shares the tailscale
# container's network namespace and publishes no ports.
#
#   cp ../.env.example .env   # fill in keys
#   TS_AUTHKEY=tskey-... docker compose up -d --build
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: jarvis
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [net_admin, sys_module]
    restart: unless-stopped

  jarvis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      - JARVIS_ALLOWED_ORIGINS=https://localhost
    volumes:
      - jarvis-data:/data
    network_mode: service:tailscale
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on: [tailscale]

  backup:
    image: alpine:3.20
    volumes:
      - jarvis-data:/data
    entrypoint: ["/bin/sh", "-c"]
    # Nightly consistent copy of the database, 7 kept. The DB holds no plaintext secrets
    # (OAuth tokens are encrypted with JARVIS_DATA_KEY, which is NOT in the volume).
    command: >
      "apk add --no-cache sqlite >/dev/null && while true; do
        mkdir -p /data/backups && sqlite3 /data/jarvis.db \".backup /data/backups/jarvis-$$(date +%F).db\" &&
        ls -1t /data/backups/*.db | tail -n +8 | xargs -r rm -f; sleep 86400; done"
    restart: unless-stopped

volumes:
  ts-state:
  jarvis-data:
