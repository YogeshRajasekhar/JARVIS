# JARVIS on a free cloud VM, reachable ONLY over your private Tailscale network with HTTPS.
# Nothing is exposed to the public internet: the jarvis container shares the tailscale
# container's network namespace and publishes no ports.
#
#   cp ../.env.example .env   # fill in keys
#   TS_AUTHKEY=tskey-... docker compose up -d --build
services:
  # One-shot: make the data volume writable by the unprivileged jarvis user (uid 10001)
  # before anything else touches it. Runs on every `up`, takes a second, then exits.
  init-data:
    image: alpine:3.20
    volumes:
      - jarvis-data:/data
    command: ["sh", "-c", "mkdir -p /data/backups && chown -R 10001:10001 /data && chmod 700 /data"]
    restart: "no"

  tailscale:
    image: tailscale/tailscale:stable
    hostname: jarvis
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [net_admin, sys_module]
    restart: unless-stopped

  jarvis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      - JARVIS_ALLOWED_ORIGINS=https://localhost
      - JARVIS_DB_PATH=/data/jarvis.db   # always the persistent volume, whatever .env says
    volumes:
      - jarvis-data:/data
    network_mode: service:tailscale
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on:
      tailscale:
        condition: service_started
      init-data:
        condition: service_completed_successfully

volumes:
  ts-state:
  jarvis-data:
